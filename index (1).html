*{box-sizing:border-box}body{margin:0;font:16px/1.5 system-ui,"Noto Sans Gujarati",sans-serif;background:var(--bg);color:var(--t)}
header{background:var(--c);border-bottom:1px solid var(--b);position:sticky;top:0;z-index:1000}
.w{max-width:960px;margin:auto;padding:12px 16px}.top{display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:700;color:var(--p);font-size:18px}
nav{display:flex;gap:6px;overflow-x:auto;padding-top:8px}
nav a,.lang button{white-space:nowrap;padding:6px 12px;border-radius:99px;border:1px solid var(--b);color:var(--t);text-decoration:none;font-size:14px;background:none;cursor:pointer}
nav a.on,.lang button.on{background:var(--p);color:#fff;border-color:var(--p)}
.card{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:16px;margin:12px 0}
h1{font-size:26px;margin:8px 0}h2{font-size:20px;margin:4px 0 10px}
.btn{display:inline-block;background:var(--p);color:#fff;border:0;border-radius:10px;padding:14px 20px;font-size:17px;font-weight:600;text-decoration:none;cursor:pointer;width:100%;text-align:center}
.btn.s{width:auto;padding:8px 14px;font-size:14px}
label{display:block;margin:12px 0 4px;font-weight:600;font-size:14px}
input,select,textarea{width:100%;padding:12px;border:1px solid var(--b);border-radius:10px;font:inherit;background:var(--bg);color:var(--t)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:600px){.g4{grid-template-columns:repeat(4,1fr)}}
.stat{text-align:center}.stat b{font-size:30px;display:block;color:var(--p)}
.m{color:var(--m);font-size:14px}
.steps{display:flex;gap:4px;margin:14px 0}.steps div{flex:1;text-align:center;font-size:12px;padding:8px 2px;border-radius:8px;background:var(--bg);border:1px solid var(--b)}.steps .d{background:var(--p);color:#fff;border-color:var(--p)}

#map{height:340px;border-radius:12px}.bar{background:var(--p);height:14px;border-radius:4px;display:inline-block;vertical-align:middle}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:1;min-width:130px}
